[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    # dropped: unused (no references under src/ or scripts/) and its `mujoco` pin fails
    # to build here (needs MUJOCO_PATH / a system mujoco install this cluster lacks).
    # "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    # [dataset] extra (pandas/pyarrow/datasets): required for LeRobotDataset/
    # LeRobotDatasetMetadata's parquet reading -- not in lerobot's base install (mirrors
    # the same finding in the root viktr pyproject.toml).
    "lerobot[dataset]>=0.6.1",
    "ml_collections==1.0.0",
    "numpy>=2.0.0,<2.3.0",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "openpi-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "chex==0.1.90",
    "treescope>=0.1.7",
    # >=4.53.2 rather than pinned exact: lerobot>=0.6.1 needs huggingface-hub>=1.6, which
    # 4.53.2 doesn't support. The transformers_replace patch (README's "Converting JAX
    # Models to PyTorch" step) targets the PyTorch model path (models_pytorch/), which
    # yor_icl_pi05_easy_pnp_v2 (JAX Pi0Config) never touches, so this bump is safe for us.
    "transformers>=4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
]


[project.urls]
Repository = "https://github.com/Physical-Intelligence/openpi"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]

[tool.uv]
# This project only ever runs on the HPC cluster (Linux x86_64, CUDA via
# jax[cuda12]/torch); restricting resolution to that platform avoids uv having to
# find a universally-satisfiable lock across irrelevant platforms (aarch64, macOS)
# whose own transitive constraints (e.g. lerobot's aarch64-specific torchcodec
# pin) would otherwise conflict with pins below.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torchcodec: lerobot[dataset] pulls it in unpinned, which uv otherwise resolves
# to the latest release (0.11.x, built for torch>=2.11) -- incompatible with our
# pinned torch==2.7.1 (ImportError: undefined symbol torch_dtype_float4_e2m1fn_x2
# at torchcodec's shared-lib load time, so lerobot silently falls back to its much
# slower pyav video decoder, which is a real GPU-utilization bottleneck in
# training). torchcodec's compat table pins 0.3-0.5 to torch 2.7. A plain
# `dependencies` pin conflicts with lerobot's own aarch64-specific torchcodec
# constraint during resolution, so this must be an override, not a dependency.
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74", "torchcodec==0.5"]

[tool.uv.sources]
openpi-client = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docker", "third_party", "src/openpi/models_pytorch/transformers_replace/*"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
